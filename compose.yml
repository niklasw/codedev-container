# Long-lived C++/Qt dev container.
#
#   export CODEDEV_SSH_DIR=~/.ssh-codedev   # ssh keys/config for git, see README
#   source codedev.sh; cd ~/src/myproj; codedev   # one container per project
#
# or by hand:
#   PROJECT_DIR=~/src/myproj podman compose up -d --build
#   podman exec -it codedev nvim .
#   VS Code: "Dev Containers: Attach to Running Container..." -> codedev
#
# Needs a Wayland session (XDG_RUNTIME_DIR and WAYLAND_DISPLAY set).

name: codedev

services:
  dev:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/codedev:latest
    # codedev.sh sets this per project folder.
    container_name: ${CODEDEV_NAME:-codedev}
    init: true

    # Map the host user onto the image's uid 1000 ("dev"), whatever the host uid is.
    userns_mode: "keep-id:uid=1000,gid=1000"
    user: dev

    # SELinux would block the bind mounts; don't use :Z on home directories.
    security_opt:
      - label=disable
    # gdb attach
    cap_add:
      - SYS_PTRACE
    # GPU for Qt/OpenGL
    devices:
      - /dev/dri

    environment:
      XDG_RUNTIME_DIR: /tmp/runtime
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      QT_QPA_PLATFORM: wayland
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      TERM: ${TERM:-xterm-256color}

    volumes:
      - ${PROJECT_DIR:-.}:/work
      # A separate nvim config for containers, writable so lazy.nvim can update
      # its lock file; plugins/parsers get built in-container.
      - ${HOME}/.config/nvim-containers:/home/dev/.config/nvim
      - nvim-data:/home/dev/.local/share/nvim
      - nvim-state:/home/dev/.local/state/nvim
      - vscode-server:/home/dev/.vscode-server
      - cache:/home/dev/.cache
      # Same Claude Code login and settings as on the host.
      - ${HOME}/.claude:/home/dev/.claude
      # Only the keys meant for the container, not the whole ~/.ssh.
      - ${CODEDEV_SSH_DIR:?set CODEDEV_SSH_DIR to a folder with ssh keys for the container}:/home/dev/.ssh:ro
      # Wayland socket, so Qt apps show up on the host desktop.
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/runtime/${WAYLAND_DISPLAY:-wayland-0}
      # Optional: git identity
      - ${HOME}/.gitconfig:/home/dev/.gitconfig:ro

# Fixed names (no project prefix), shared with .devcontainer/devcontainer.json.
volumes:
  nvim-data:
    name: codedev-nvim-data
  nvim-state:
    name: codedev-nvim-state
  vscode-server:
    name: codedev-vscode-server
  cache:
    name: codedev-cache
